services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: glitchhunt
      POSTGRES_DB: glitchhunt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    ports: ["127.0.0.1:55439:5432"]
    volumes: ["glitchhunt-pg:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchhunt"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  glitchhunt-pg:
